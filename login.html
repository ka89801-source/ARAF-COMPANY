<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0F2733">
<title>أعراف للأعمال | دخول المنشآت</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>

*{margin:0;padding:0;box-sizing:border-box}
:root{
  --nv:#1B3A4B;--nvl:#234D63;--nvd:#0F2733;--nvdd:#0A1E28;--tl:#3D7B8A;
  --gd:#C9A96E;--gdl:#D9BF8E;--gdd:#A8874C;
  --bg:#FAFAF7;--cd:#FFFFFF;--t1:#1B2B36;--t2:#51687A;--tm:#93A5B1;
  --line:rgba(27,58,75,.09);--line-gold:rgba(201,169,110,.28);
  --sh-1:0 1px 2px rgba(27,58,75,.04),0 4px 16px rgba(27,58,75,.05);
  --sh-2:0 2px 4px rgba(27,58,75,.04),0 12px 32px rgba(27,58,75,.08);
  --sh-3:0 4px 8px rgba(27,58,75,.05),0 24px 56px rgba(27,58,75,.11);
  --err:#B91C1C;--warn:#B45309;
  --sw:268px;--ease:cubic-bezier(.22,.61,.36,1);
  --hero-grad:
    radial-gradient(700px 380px at 92% 2%, rgba(201,169,110,.14), transparent 55%),
    radial-gradient(1100px 500px at 85% -10%, rgba(61,123,138,.22), transparent 60%),
    linear-gradient(165deg, #0F2733 0%, #1B3A4B 60%, #234D63 100%);
}
html{scroll-behavior:smooth}
body{font-family:'Tajawal',sans-serif;background:var(--bg);color:var(--t1);line-height:1.8;-webkit-font-smoothing:antialiased;overflow-x:hidden;min-height:100vh}
::selection{background:rgba(201,169,110,.3)}
:focus-visible{outline:2px solid var(--gd);outline-offset:3px;border-radius:8px}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-thumb{background:rgba(27,58,75,.14);border-radius:3px}
.view{display:none}.view.show{display:block}
.wrap{max-width:1140px;margin:0 auto;padding:0 22px}

.mock-logo{border-radius:14px;background:#fff;border:1px solid var(--line-gold);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.mock-logo svg{stroke:var(--gdd);fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-width:1.5}
.mock-logo.dark{background:rgba(201,169,110,.1);border-color:rgba(217,191,142,.35)}
.mock-logo.dark svg{stroke:var(--gdl)}

.demo-bar{position:fixed;bottom:16px;right:16px;z-index:99999;display:flex;gap:6px;background:var(--nvdd);border:1px solid rgba(217,191,142,.3);border-radius:100px;padding:6px 8px;box-shadow:var(--sh-3)}
.demo-bar button{border:none;background:transparent;color:rgba(255,255,255,.55);font-family:'Cairo',sans-serif;font-size:11px;font-weight:700;padding:7px 14px;border-radius:100px;cursor:pointer;transition:color .3s var(--ease)}
.demo-bar button:hover{color:#fff}
.demo-bar button.on{background:linear-gradient(120deg,var(--gd),var(--gdl));color:var(--nvd)}

.toast{position:fixed;bottom:70px;left:50%;transform:translateX(-50%) translateY(14px);background:var(--nvd);color:var(--gdl);padding:11px 26px;border-radius:100px;font-size:12.5px;font-weight:500;opacity:0;transition:opacity .3s var(--ease),transform .3s var(--ease);z-index:99998;pointer-events:none;box-shadow:var(--sh-3);white-space:nowrap;max-width:calc(100vw - 32px);overflow:hidden;text-overflow:ellipsis}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;padding:13px 26px;border-radius:100px;font-family:'Cairo',sans-serif;font-size:14px;font-weight:800;text-decoration:none;cursor:pointer;border:none;transition:transform .3s var(--ease),box-shadow .3s var(--ease),background .3s var(--ease),border-color .3s var(--ease),color .3s var(--ease)}
.btn .arr{display:inline-block;transition:transform .3s var(--ease)}
.btn:hover .arr{transform:translateX(-4px)}
.btn-gold{background:linear-gradient(120deg,var(--gd),var(--gdl));color:var(--nvd);box-shadow:0 10px 30px rgba(201,169,110,.28)}
.btn-gold:hover{transform:translateY(-2px)}
.btn-navy{background:var(--nv);color:var(--gdl)}
.btn-navy:hover{background:var(--nvl);transform:translateY(-2px)}
.btn-out-dark{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.25)}
.btn-out-dark:hover{border-color:var(--gd);color:var(--gdl)}
.btn-out-light{background:transparent;color:var(--nv);border:1px solid rgba(27,58,75,.16)}
.btn-out-light:hover{background:var(--nv);color:var(--gdl);border-color:var(--nv)}

.scale-svg path,.scale-svg line,.scale-svg circle{stroke:url(#gGold);stroke-width:1.4;fill:none;stroke-linecap:round}
.scale-gdl path,.scale-gdl line,.scale-gdl circle{stroke:var(--gdl);stroke-width:1.4;fill:none;stroke-linecap:round}


/* Production overrides */
.toast{bottom:24px}
.brand-logo{width:46px;height:46px;object-fit:contain;display:block}

/* ═══════════ 2) الدخول ═══════════ */
#vLogin{min-height:100vh;min-height:100dvh;display:none;align-items:center;justify-content:center;padding:22px;background:var(--hero-grad);position:relative;overflow:hidden}
#vLogin.show{display:flex}
.login-scale{position:absolute;left:3%;bottom:6%;width:min(300px,24vw);opacity:.14;pointer-events:none}
.lcard{position:relative;z-index:2;width:100%;max-width:420px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);border-radius:26px;backdrop-filter:blur(10px);padding:38px 30px}
.ll{display:flex;flex-direction:column;align-items:center;gap:14px;margin-bottom:20px}
.biz-badge{display:inline-flex;align-items:center;gap:11px;color:var(--gdl);font-size:12px;font-weight:700;letter-spacing:.6px}
.biz-badge::before,.biz-badge::after{content:'';width:22px;height:1px;background:linear-gradient(90deg,transparent,var(--gd))}
.biz-badge::after{background:linear-gradient(90deg,var(--gd),transparent)}
.lhead{text-align:center;margin-bottom:24px}
.lhead h1{font-family:'Cairo',sans-serif;font-size:20px;font-weight:900;color:#fff;line-height:1.55;letter-spacing:-.3px}
.lhead p{font-size:12.5px;font-weight:300;color:rgba(255,255,255,.55);margin-top:6px;line-height:1.95}
.lfg{margin-bottom:14px}
.lfg label{display:block;font-size:12px;color:rgba(255,255,255,.55);margin-bottom:6px;font-weight:500}
.lfg input{width:100%;padding:13px 15px;border-radius:14px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.06);color:#fff;font-family:inherit;font-size:16px;outline:none;letter-spacing:.5px;transition:border-color .3s var(--ease),box-shadow .3s var(--ease)}
.lfg input::placeholder{color:rgba(255,255,255,.26);letter-spacing:0}
.lfg input:focus{border-color:rgba(201,169,110,.6);box-shadow:0 0 0 4px rgba(201,169,110,.13)}
.lbtn{width:100%;padding:14px;border-radius:100px;border:none;margin-top:6px;background:linear-gradient(120deg,var(--gd),var(--gdl));color:var(--nvd);font-family:'Cairo',sans-serif;font-size:15px;font-weight:800;cursor:pointer;box-shadow:0 10px 30px rgba(201,169,110,.28);transition:transform .3s var(--ease);display:inline-flex;align-items:center;justify-content:center;gap:9px}
.lbtn .arr{display:inline-block;transition:transform .3s var(--ease)}
.lbtn:hover{transform:translateY(-2px)}
.lbtn:hover .arr{transform:translateX(-4px)}
.lbtn.shake{animation:shk .45s}
@keyframes shk{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.demo-accounts{margin-top:20px;padding-top:18px;border-top:1px solid rgba(255,255,255,.1)}
.demo-accounts .dat{font-size:11px;font-weight:300;color:rgba(255,255,255,.45);margin-bottom:10px;text-align:center}
.demo-accounts .dab{display:flex;gap:7px;flex-wrap:wrap}
.demo-accounts button{flex:1;min-width:96px;padding:9px 6px;border-radius:14px;border:1px solid rgba(255,255,255,.14);background:transparent;color:rgba(255,255,255,.75);font-family:inherit;font-size:11px;font-weight:500;cursor:pointer;transition:border-color .3s var(--ease),color .3s var(--ease);line-height:1.7}
.demo-accounts button:hover{border-color:var(--gd);color:var(--gdl)}
.demo-accounts button small{display:block;color:rgba(255,255,255,.38);font-size:9.5px;font-weight:300}


@media(max-width:1024px){
  .strip-card{grid-template-columns:repeat(2,1fr)}
  .strip-it:nth-child(3)::before{display:none}
  .strip-it:nth-child(n+3){border-top:1px solid var(--line)}
  .qgrid{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:720px){
  .sec{padding:70px 0 0}
  .hero{padding-bottom:118px}
  .hero-in{padding-top:36px}
  .hero h1{font-size:clamp(24px,7vw,32px)}
  .hero-cta .btn{width:100%}
  .scale-mark{left:auto;right:-30px;top:12%;transform:none;width:150px;opacity:.13}
  .strip{margin-top:-58px}
  .strip-card{grid-template-columns:1fr}
  .strip-it::before{display:none!important}
  .strip-it+.strip-it{border-top:1px solid var(--line)}
  .plans{grid-template-columns:1fr}
  .plan.featured{order:-1}
  .join-in{grid-template-columns:1fr;gap:34px}
  .dark-sec{margin-top:70px;padding:64px 0}
  .cta-final{padding:70px 0}
  .top-acts .btn{padding:11px 18px;font-size:13px}
  .login-scale{left:auto;right:-40px;top:4%;bottom:auto;width:140px;opacity:.1}
  .lcard{padding:30px 22px}
  .side{transform:translateX(100%)}
  .side.open{transform:translateX(0);box-shadow:-16px 0 44px rgba(0,0,0,.3)}
  .sb-close{display:flex}
  .mn{margin-right:0}
  .tpmenu{display:flex}
  .pc{padding:20px 16px 46px}
  .tp-entity .tn{display:none}
  .qgrid{grid-template-columns:1fr 1fr;gap:10px}
  .svc-grid{grid-template-columns:1fr}
  .mgr-acts{width:100%}
  .mgr-btn{flex:1;justify-content:center}
  .mdl{padding:0;align-items:flex-end}
  .mdlb{max-width:100%;max-height:92dvh;border-radius:24px 24px 0 0;animation:mUp .4s var(--ease)}
  @keyframes mUp{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:none}}
}
@media(prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
  .rev,.fu,.sp-hello,.sp-entity,.sp-sub,.sp-seal,.sp-bar{opacity:1!important;transform:none!important}
  .sp-scale path,.sp-scale line,.sp-scale circle{stroke-dashoffset:0!important}
}

#vLogin{display:flex}
.login-logo{width:82px;height:82px;object-fit:contain;display:block;filter:drop-shadow(0 8px 22px rgba(0,0,0,.12))}
.login-back{display:inline-flex;align-items:center;justify-content:center;margin-top:18px;color:rgba(255,255,255,.48);font-size:11.5px;text-decoration:none;transition:color .3s var(--ease)}
.login-back:hover{color:var(--gdl)}
</style>
</head>
<body>
<div id="vLogin">
  <svg class="login-scale scale-gdl" viewBox="0 0 200 220" aria-hidden="true"><line x1="100" y1="18" x2="100" y2="178"/><line x1="34" y1="48" x2="166" y2="48"/><circle cx="100" cy="14" r="5"/><line x1="34" y1="48" x2="16" y2="102"/><line x1="34" y1="48" x2="52" y2="102"/><path d="M10 102 a24 14 0 0 0 48 0"/><line x1="166" y1="48" x2="148" y2="102"/><line x1="166" y1="48" x2="184" y2="102"/><path d="M142 102 a24 14 0 0 0 48 0"/><line x1="64" y1="192" x2="136" y2="192"/></svg>
  <main class="lcard">
    <div class="ll"><img class="login-logo" src="logo.png" alt="أعراف"><span class="biz-badge">بوابة الأعمال</span></div>
    <div class="lhead"><h1>دخول المنشآت</h1><p>أدخل رمز منشأتك والرقم السري المرسل إليكم من فريق أعراف</p></div>
    <div class="lfg"><label for="bizCode">رمز المنشأة</label><input type="text" id="bizCode" placeholder="ARF-XXXX" autocomplete="username" autocapitalize="characters"></div>
    <div class="lfg"><label for="bizPin">الرقم السري</label><input type="password" id="bizPin" placeholder="••••••" inputmode="numeric" maxlength="6" autocomplete="current-password"></div>
    <button class="lbtn" id="LB">الدخول إلى بوابة الأعمال <span class="arr">←</span></button>
    <a class="login-back" href="index.html">العودة إلى أعراف للأعمال</a>
  </main>
</div>
<div class="toast" id="T"></div>
<script src="accounts.js"></script>
<script>
function $(id){return document.getElementById(id)}
function toast(m){var t=$('T');t.textContent=m;t.classList.add('show');setTimeout(function(){t.classList.remove('show')},2400)}
try{var s=JSON.parse(localStorage.getItem('araf_biz_session')||'null');if(s&&s.code&&(window.ARAF_BIZ_ACCOUNTS||[]).some(function(a){return a.code===s.code}))window.location.replace('platform.html')}catch(e){}
function bump(){var b=$('LB');b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake')}
function tryLogin(){
 var code=$('bizCode').value.trim().toUpperCase(),pin=$('bizPin').value.trim();
 if(!code||!pin){toast('يرجى إدخال رمز المنشأة والرقم السري');bump();return}
 var acc=(window.ARAF_BIZ_ACCOUNTS||[]).find(function(a){return a.code.toUpperCase()===code&&String(a.pin)===pin});
 if(!acc){toast('البيانات غير صحيحة — تأكد من الرمز والرقم السري');bump();return}
 localStorage.setItem('araf_biz_session',JSON.stringify({code:acc.code,ts:Date.now()}));
 sessionStorage.setItem('araf_biz_fresh_login','1');
 window.location.href='platform.html';
}
$('LB').onclick=tryLogin;
$('bizPin').addEventListener('keydown',function(e){if(e.key==='Enter')tryLogin()});
$('bizCode').addEventListener('keydown',function(e){if(e.key==='Enter')$('bizPin').focus()});
$('bizCode').addEventListener('input',function(){this.value=this.value.toUpperCase()});
</script>
</body>
</html>
