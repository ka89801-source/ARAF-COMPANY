<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0F2733">
<title>أعراف للأعمال | دخول المنشآت</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --nv:#1B3A4B;--nvl:#234D63;--nvd:#0F2733;--nvdd:#0A1E28;
  --gd:#C9A96E;--gdl:#D9BF8E;--gdd:#A8874C;
  --ease:cubic-bezier(.22,.61,.36,1);
}
body{
  font-family:'Tajawal',sans-serif;min-height:100vh;min-height:100dvh;
  display:flex;align-items:center;justify-content:center;padding:22px;
  -webkit-font-smoothing:antialiased;overflow-x:hidden;
  background:
    radial-gradient(700px 380px at 92% 2%, rgba(201,169,110,.14), transparent 55%),
    radial-gradient(1100px 500px at 85% -10%, rgba(61,123,138,.22), transparent 60%),
    linear-gradient(165deg, var(--nvd) 0%, var(--nv) 60%, var(--nvl) 100%);
}
::selection{background:rgba(201,169,110,.3)}
:focus-visible{outline:2px solid var(--gd);outline-offset:3px;border-radius:8px}

/* الميزان — زخرفة خلفية */
.scale-bg{position:fixed;left:3%;bottom:6%;width:min(300px,24vw);opacity:.14;pointer-events:none}
.scale-bg path,.scale-bg line,.scale-bg circle{stroke:var(--gdl);stroke-width:1.4;fill:none;stroke-linecap:round}

.lcard{
  position:relative;z-index:2;width:100%;max-width:420px;
  background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);
  border-radius:26px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  padding:38px 30px;
  animation:cIn .6s var(--ease) both;
}
@keyframes cIn{from{opacity:0;transform:translateY(22px) scale(.98)}to{opacity:1;transform:none}}
.ll{display:flex;flex-direction:column;align-items:center;gap:14px;margin-bottom:20px}
.ll img{width:82px;height:82px;object-fit:contain;background:#fff;border-radius:18px;padding:8px;border:1px solid rgba(255,255,255,.14)}
.biz-badge{display:inline-flex;align-items:center;gap:11px;color:var(--gdl);font-size:12px;font-weight:700;letter-spacing:.6px}
.biz-badge::before,.biz-badge::after{content:'';width:22px;height:1px;background:linear-gradient(90deg,transparent,var(--gd))}
.biz-badge::after{background:linear-gradient(90deg,var(--gd),transparent)}
.lhead{text-align:center;margin-bottom:24px}
.lhead h1{font-family:'Cairo',sans-serif;font-size:20px;font-weight:900;color:#fff;line-height:1.55;letter-spacing:-.3px}
.lhead p{font-size:12.5px;font-weight:300;color:rgba(255,255,255,.55);margin-top:6px;line-height:1.95}
.lfg{margin-bottom:14px}
.lfg label{display:block;font-size:12px;color:rgba(255,255,255,.55);margin-bottom:6px;font-weight:500}
.lfg input{
  width:100%;padding:13px 15px;border-radius:14px;
  border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.06);
  color:#fff;font-family:inherit;font-size:16px;outline:none;letter-spacing:.5px;
  transition:border-color .3s var(--ease),box-shadow .3s var(--ease);
}
.lfg input::placeholder{color:rgba(255,255,255,.26);letter-spacing:0}
.lfg input:focus{border-color:rgba(201,169,110,.6);box-shadow:0 0 0 4px rgba(201,169,110,.13)}
.lbtn{
  width:100%;padding:14px;border-radius:100px;border:none;margin-top:6px;
  background:linear-gradient(120deg,var(--gd),var(--gdl));color:var(--nvd);
  font-family:'Cairo',sans-serif;font-size:15px;font-weight:800;cursor:pointer;
  box-shadow:0 10px 30px rgba(201,169,110,.28);
  transition:transform .3s var(--ease),box-shadow .3s var(--ease);
  display:inline-flex;align-items:center;justify-content:center;gap:9px;
}
.lbtn .arr{display:inline-block;transition:transform .3s var(--ease)}
.lbtn:hover{transform:translateY(-2px)}
.lbtn:hover .arr{transform:translateX(-4px)}
.lbtn.shake{animation:shk .45s}
@keyframes shk{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.lhint{margin-top:20px;padding-top:18px;border-top:1px solid rgba(255,255,255,.1);font-size:12px;font-weight:300;color:rgba(255,255,255,.45);line-height:2;text-align:center}
.lhint a{color:var(--gdl);text-decoration:none;font-weight:700}
.lfooter{text-align:center;margin-top:20px;font-size:10px;font-weight:300;color:rgba(255,255,255,.22)}
.toast{
  position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(14px);
  background:#fff;color:var(--nvd);padding:11px 26px;border-radius:100px;
  font-size:12.5px;font-weight:700;opacity:0;transition:opacity .3s var(--ease),transform .3s var(--ease);
  z-index:9999;pointer-events:none;box-shadow:0 4px 8px rgba(27,58,75,.05),0 24px 56px rgba(27,58,75,.25);white-space:nowrap;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(max-width:720px){
  .lcard{padding:30px 22px}
  .scale-bg{left:auto;right:-40px;top:4%;bottom:auto;width:140px;opacity:.1}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<svg class="scale-bg" viewBox="0 0 200 220" aria-hidden="true">
  <line x1="100" y1="18" x2="100" y2="178"/>
  <line x1="34" y1="48" x2="166" y2="48"/>
  <circle cx="100" cy="14" r="5"/>
  <line x1="34" y1="48" x2="16" y2="102"/><line x1="34" y1="48" x2="52" y2="102"/>
  <path d="M10 102 a24 14 0 0 0 48 0"/>
  <line x1="166" y1="48" x2="148" y2="102"/><line x1="166" y1="48" x2="184" y2="102"/>
  <path d="M142 102 a24 14 0 0 0 48 0"/>
  <line x1="64" y1="192" x2="136" y2="192"/>
</svg>

<main class="lcard">
  <div class="ll">
    <img src="logo.png" alt="شعار أعراف">
    <span class="biz-badge">بوابة الأعمال</span>
  </div>

  <div class="lhead">
    <h1>دخول المنشآت</h1>
    <p>أدخل رمز منشأتك والرقم السري المرسل إليكم من فريق أعراف</p>
  </div>

  <div class="lfg">
    <label for="bizCode">رمز المنشأة</label>
    <input type="text" id="bizCode" placeholder="ARF-XXXX" autocomplete="off" autocapitalize="characters">
  </div>
  <div class="lfg">
    <label for="bizPin">الرقم السري</label>
    <input type="password" id="bizPin" placeholder="••••••" inputmode="numeric" maxlength="6" autocomplete="off">
  </div>
  <button class="lbtn" id="LB">الدخول إلى بوابة الأعمال <span class="arr">←</span></button>

  <div class="lhint">
    منشأتك ليست مشتركة بعد؟
    <a href="index.html#join">اطلب انضمام منشأتك</a><br>
    وسيتواصل معكم فريق أعراف لتفعيل حسابكم
  </div>

  <div class="lfooter">© 2026 شركة أعراف للمحاماة والاستشارات القانونية — جميع الحقوق محفوظة</div>
</main>

<div class="toast" id="T"></div>

<script src="accounts.js"></script>
<script>
function $(id){return document.getElementById(id)}
function toast(m){var t=$('T');t.textContent=m;t.classList.add('show');setTimeout(function(){t.classList.remove('show')},2400)}

/* إن كانت هناك جلسة قائمة، ادخل مباشرة */
try{
  var s=JSON.parse(localStorage.getItem('araf_biz_session')||'null');
  if(s&&s.code&&(window.ARAF_BIZ_ACCOUNTS||[]).some(function(a){return a.code===s.code})){
    window.location.replace('platform.html');
  }
}catch(e){}

function tryLogin(){
  var code=$('bizCode').value.trim().toUpperCase();
  var pin=$('bizPin').value.trim();

  if(!code||!pin){toast('يرجى إدخال رمز المنشأة والرقم السري');bump();return}

  var acc=(window.ARAF_BIZ_ACCOUNTS||[]).find(function(a){
    return a.code.toUpperCase()===code && String(a.pin)===pin
  });

  if(!acc){toast('البيانات غير صحيحة — تأكد من الرمز والرقم السري');bump();return}

  localStorage.setItem('araf_biz_session',JSON.stringify({code:acc.code,ts:Date.now()}));
  sessionStorage.setItem('araf_biz_fresh_login','1');
  window.location.href='platform.html';
}

function bump(){var b=$('LB');b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake')}

$('LB').onclick=tryLogin;
$('bizPin').addEventListener('keydown',function(e){if(e.key==='Enter')tryLogin()});
$('bizCode').addEventListener('keydown',function(e){if(e.key==='Enter')$('bizPin').focus()});
</script>
</body>
</html>
